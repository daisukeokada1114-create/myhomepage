<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お知らせ編集</title>
</head>

<body>
  <h1>お知らせ編集</h1>

  <!-- エラーメッセージ表示 -->
  <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red;"></p>

  <form action="/notice/update" method="post">

    <!-- 更新対象のIDをおくる -->
    <input type="hidden" name="id" th:value="${notice.id}">

    <p>タイトル</p>
    <input type="text" name="title" th:value="${notice.title}">

    <p>本文</p>
    <textarea name="content" th:text="${notice.content}"></textarea>

    <br><br>

    <button type="submit">更新する</button>

  </form>

  <p>
    <a href="/">戻る</a>
  </p>
</body>

</html>
