<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美容室サイト</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
  <!-- ヘッダー -->
  <header>

    <!-- javaから渡された店名 -->
    <h1 th:text="${salonName}">
      店名
    </h1>

    <!-- javaから渡されたキャッチコピー -->
    <p th:text="${concept}">
      サロンのコンセプトを記入
    </p>

    <a href="#" class="reserve-button">
      ご予約はこちら
    </a>
  </header>

  <!-- メイン部分 -->
  <main>


    <!-- 店舗紹介 -->
    <section>

      <!-- consept -->
      <h2>
        Java Spring Bootで作成した架空案件ホームページ
      </h2>

      <p>
        具体的にユーザーに伝えたいこと コンセプト
      </p>

      <h2>Menu</h2>

      <ul>
        <!-- javaから受け取ったmenus を一つづつ表示 -->
        <li th:each="menu : ${menus}">

          <!-- menu[0] = メニュー名 -->
          <span th:text="${menu[0]}"></span>
          <!-- menu[1] = 価格 -->
          <span th:text="${menu[1]}"></span>
          <!-- menu[2] = 説明 -->
          <span th:text="${menu[2]}"></span>

        </li>

      </ul>

    </section>
  </main>

</body>

</html>
