<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お店のサイト</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
  <!-- ヘッダー -->
  <header>

    <!-- javaから渡された店名 -->
    <h1 th:text="${salonName}">
      Java Spring Bootで作成した架空案件ホームページ
    </h1>

    <!-- javaから渡されたキャッチコピー -->
    <p th:text="${concept}">
      キャッチコピー
    </p>

    <a href="#" class="reserve-button">
      ご予約はこちら
    </a>
  </header>

  <!-- メイン部分 -->
  <main>


    <!-- 店舗紹介 -->
    <section class="notice-section">

      <!-- セクションタイトル -->
      <h2>お知らせ</h2>
      <!-- お知らせ一覧 -->
      <div class="notice-list">
        <!-- noticeList を一件ずつ表示 -->
        <article th:each="notice : ${noticeList}" class="notice-card">

          <!-- お知らせのタイトル -->
          <h3 class="notice-title" th:text="${notice.title}">タイトル</h3>

          <!-- お知らせの本文 -->
          <p class="notice-content" th:text="${notice.content}">本文</p>

          <!-- 作成日時 -->
          <p class="notice-date">
            作成日時：
            <span th:text="${notice.createdAt}">
              2026-05-22
            </span>
          </p>

        </article>



      </div>


      <h2>Menu</h2>

      <ul>
        <!-- javaから受け取ったmenus を一つづつ表示 -->
        <li th:each="menu : ${menus}">

          <!-- menu[0] = メニュー名 -->
          <span th:text="${menu[0]}"></span>
          <!-- menu[1] = 価格 -->
          <span th:text="${menu[1]}"></span>
          <!-- menu[2] = 説明 -->
          <span th:text="${menu[2]}"></span>

        </li>

      </ul>

    </section>
  </main>

</body>

</html>
